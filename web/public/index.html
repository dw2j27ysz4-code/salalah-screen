<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>شاشة صلالة</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css?v=__V__">
</head>
<body>
  <div id="skyA" class="sky"></div>
  <div id="skyB" class="sky"></div>
  <div id="stars"></div>

  <main>
    <section class="top">
      <div class="clock-col">
        <div class="greeting-wrap"><div id="greeting" class="greeting"></div></div>
        <div class="clock">
          <span id="hm">--:--</span>
          <span id="ampm" class="clock-side"></span>
        </div>
        <div id="greg" class="date"></div>
        <div id="hijri" class="date gold"></div>
        <div class="spacer"></div>
        <div class="next-card glass">
          <div id="nowBanner" class="now-banner"></div>
          <div class="next-row">
            <div>
              <div class="lbl" data-w="next_label"></div>
              <div id="nextName" class="next-name">جارٍ تحميل أوقات الصلاة…</div>
            </div>
            <div>
              <div class="lbl" data-w="left_label"></div>
              <div id="countdown" class="countdown">--:--:--</div>
            </div>
          </div>
        </div>
      </div>

      <div id="weather" class="weather glass">
        <div class="muted">جارٍ تحميل الطقس…</div>
      </div>
    </section>

    <section id="prayers" class="prayers glass">
      <div class="muted loading">جارٍ تحميل أوقات الصلاة…</div>
    </section>
  </main>

  <div id="hint" class="hint">اضغط OK في الريموت لفتح الإعدادات</div>
  <footer class="news glass">
    <div class="news-label" data-w="news"></div>
    <div id="ticker" class="ticker"><span id="tickerText">جارٍ تحميل الأخبار…</span></div>
  </footer>

  <div id="settings" class="settings hidden">
    <div class="settings-card glass">
      <div class="settings-title">الإعدادات</div>
      <div class="muted">تعديل التاريخ الهجري حسب إعلان رؤية الهلال في سلطنة عُمان</div>
      <div class="btn-row">
        <button class="btn" data-offset="-1">يوم ناقص (−1)</button>
        <button class="btn" data-offset="0">بدون تعديل</button>
        <button class="btn" data-offset="1">يوم زائد (+1)</button>
      </div>
      <div id="hijriPreview" class="gold bold preview"></div>
      <div class="rule"></div>
      <div class="muted small">أوقات الصلاة مطابَقة لتقويم وزارة الأوقاف والشؤون الدينية لصلالة.</div>
      <div class="btn-row">
        <button class="btn" data-action="refresh">تحديث البيانات الآن</button>
        <button class="btn" data-action="close">إغلاق</button>
      </div>
    </div>
  </div>

  <script src="labels.js?v=__V__"></script>
  <script src="app.js?v=__V__"></script>
</body>
</html>
