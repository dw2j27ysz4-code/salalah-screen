<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مبارزة الأثر</title>
  <link rel="stylesheet" href="games.css">
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
  <script src="link.js"></script>
  <script src="lobby.js"></script>
  <script src="fx.js"></script>
</head>
<body class="tv">
  <div id="hud">
    <div class="score" id="s1"><span class="dotc gold"></span><b>0</b></div>
    <div class="hud-title">مبارزة الأثر <span class="dim">· الفائز من يكسب 5 جولات</span></div>
    <div class="score" id="s0"><b>0</b><span class="dotc cyan"></span></div>
  </div>
  <div id="stage"></div>
  <div id="banner"></div>
  <div id="lobby" class="lobby glass"></div>

  <script>
    // TV side of the light-trail duel: two riders on a grid leave a wall of light behind
    // them; touching any wall or trail loses the round. Phones send absolute directions.
    // Trails are glowing ribbons stamped into a persistent texture (fx.js decals).
    (function () {
      'use strict';
      var COLS = 96, ROWS = 54, CELL = 1600 / COLS, W = 1600, H = 900, WIN = 5;
      var COLORS = ['#5fd0ff', '#f6cf6a'];
      var DIRS = { u: [0, -1], d: [0, 1], l: [-1, 0], r: [1, 0] };
      var START_TICK = 75, MIN_TICK = 45; // ms per cell; speeds up during a round

      var grid, riders, score = [0, 0], phase = 'lobby', phaseEnd = 0, tickMs = START_TICK, lastTick = 0;

      var lobby = Lobby.create({
        game: 'trail',
        title: 'مبارزة الأثر',
        hint: 'وجّه خطّك بالأسهم أو بالسحب، وحاصر خصمك',
        slots: [{ name: 'الأزرق · يسار', color: COLORS[0] }, { name: 'الذهبي · يمين', color: COLORS[1] }],
        onTurn: function (slot, m) {
          var r = riders && riders[slot];
          if (!r || !DIRS[m.d]) return;
          // Queue up to two turns so a quick double turn between ticks isn't lost.
          if (r.queue.length < 2) r.queue.push(m.d);
        },
        onReady: function () { score = [0, 0]; showScore(); newRound(); },
        onAgain: function () { if (phase === 'over') { score = [0, 0]; showScore(); newRound(); } },
        onLeft: function () { phase = 'lobby'; },
      });

      function cx(x) { return (x + 0.5) * CELL; }
      function cy(y) { return (y + 0.5) * CELL; }

      function newRound() {
        grid = new Uint8Array(COLS * ROWS);
        riders = [
          { x: 12, y: ROWS >> 1, dir: 'r', queue: [], alive: true },
          { x: COLS - 13, y: ROWS >> 1, dir: 'l', queue: [], alive: true },
        ];
        riders.forEach(function (r, i) { grid[r.y * COLS + r.x] = i + 1; r.px = r.x; r.py = r.y; });
        fx.clearDecals();
        tickMs = START_TICK;
        phase = 'countdown'; phaseEnd = Date.now() + 3000;
        riders.forEach(function (r, i) { fx.ring(cx(r.x), cy(r.y), COLORS[i], 160, 0.6); });
        lobby.broadcast({ t: 'state', phase: 'play', score: score });
      }

      function opposite(a, b) { return DIRS[a][0] === -DIRS[b][0] && DIRS[a][1] === -DIRS[b][1]; }

      // Computer rider: score every legal direction by the open area it leads into (bounded
      // flood fill), the straight run ahead and a small preference for going straight;
      // avoids cells next to the opponent's head. Occasionally hesitates, like a person.
      var seen = new Uint8Array(COLS * ROWS), bfs = new Int32Array(COLS * ROWS);
      function blocked(x, y) { return x < 0 || y < 0 || x >= COLS || y >= ROWS || grid[y * COLS + x] !== 0; }
      function space(x, y, limit) {
        seen.fill(0);
        var head = 0, tail = 0, count = 0;
        bfs[tail++] = y * COLS + x; seen[y * COLS + x] = 1;
        while (head < tail && count < limit) {
          var c = bfs[head++], cxx = c % COLS, cyy = (c / COLS) | 0; count++;
          [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (d) {
            var nx = cxx + d[0], ny = cyy + d[1], k = ny * COLS + nx;
            if (!blocked(nx, ny) && !seen[k]) { seen[k] = 1; bfs[tail++] = k; }
          });
        }
        return count;
      }
      function cpuChoose(i) {
        if (Math.random() < 0.04) return;
        var r = riders[i], o = riders[1 - i], best = null, bestScore = -Infinity;
        Object.keys(DIRS).forEach(function (d) {
          if (opposite(d, r.dir)) return;
          var nx = r.x + DIRS[d][0], ny = r.y + DIRS[d][1];
          if (blocked(nx, ny)) return;
          var run = 0, x = nx, y = ny;
          while (run < 12 && !blocked(x + DIRS[d][0], y + DIRS[d][1])) { x += DIRS[d][0]; y += DIRS[d][1]; run++; }
          var near = Math.abs(o.x - nx) + Math.abs(o.y - ny) < 3 ? 60 : 0;
          var s = space(nx, ny, 400) * 4 + run + (d === r.dir ? 3 : 0) - near + Math.random() * 2;
          if (s > bestScore) { bestScore = s; best = d; }
        });
        if (best && best !== r.dir) r.queue = [best];
      }

      function tick() {
        riders.forEach(function (r, i) { if (lobby.isCpu(i)) cpuChoose(i); });
        riders.forEach(function (r) {
          while (r.queue.length) {
            var d = r.queue.shift();
            if (d !== r.dir && !opposite(d, r.dir)) { r.dir = d; break; }
          }
          r.nx = r.x + DIRS[r.dir][0]; r.ny = r.y + DIRS[r.dir][1];
        });
        var headOn = riders[0].nx === riders[1].nx && riders[0].ny === riders[1].ny;
        riders.forEach(function (r) {
          var out = r.nx < 0 || r.ny < 0 || r.nx >= COLS || r.ny >= ROWS;
          if (out || headOn || grid[r.ny * COLS + r.nx]) r.alive = false;
        });
        riders.forEach(function (r, i) {
          if (!r.alive) return;
          paintSegment(r.x, r.y, r.nx, r.ny, i);
          r.px = r.x; r.py = r.y; r.x = r.nx; r.y = r.ny;
          grid[r.y * COLS + r.x] = i + 1;
          fx.emit({ x: cx(r.x), y: cy(r.y), count: 2, color: COLORS[i], speed: [20, 90], life: [0.3, 0.6], size: 16 });
        });
        if (!riders[0].alive || !riders[1].alive) endRound();
        tickMs = Math.max(MIN_TICK, tickMs - 0.15);
      }

      function crash(r, i) {
        var x = cx(r.x), y = cy(r.y);
        fx.emit({ x: x, y: y, count: 40, color: [COLORS[i], 0xffffff], tex: 'spark', speed: [300, 1200], life: [0.3, 0.8], size: 40, drag: 2.5 });
        fx.emit({ x: x, y: y, count: 16, color: COLORS[i], speed: [60, 300], life: [0.5, 1.1], size: 90 });
        fx.ring(x, y, COLORS[i], 500, 0.55);
      }

      function endRound() {
        var a = riders[0].alive, b = riders[1].alive;
        sound(140, 0.5);
        riders.forEach(function (r, i) { if (!r.alive) crash(r, i); });
        fx.shake(20, 450); fx.flash(0.22);
        if (a === b) {
          banner('تعادل', '#ffffff', 1500);
          riders.forEach(function (_, i) { lobby.send(i, { t: 'buzz', ms: 300 }); });
        } else {
          var w = a ? 0 : 1;
          score[w]++; showScore();
          lobby.send(w, { t: 'buzz', ms: 80 });
          lobby.send(1 - w, { t: 'buzz', ms: 400 });
          if (score[w] >= WIN) {
            phase = 'over';
            banner('فاز ' + (w === 0 ? 'الأزرق' : 'الذهبي') + ' ' + score[w] + ' – ' + score[1 - w] +
              '<small>اضغط «مباراة جديدة» على الجوال</small>', COLORS[w], 0);
            lobby.broadcast({ t: 'state', phase: 'over', winner: w, score: score, solo: lobby.solo() });
            return;
          }
          banner('جولة ' + (w === 0 ? 'للأزرق' : 'للذهبي'), COLORS[w], 1500);
        }
        phase = 'between'; phaseEnd = Date.now() + 1800;
      }

      // ---- Look ----
      var fx = GameFX.create(document.getElementById('stage'), W, H);

      // Board: dark glass with a faint grid that fades toward the edges, and a lit rim.
      fx.sprite(fx.texture(W, H, function (g) {
        var R = GameFX.roundRect;
        var base = g.createLinearGradient(0, 0, 0, H);
        base.addColorStop(0, '#2e3036'); base.addColorStop(1, '#17181c');
        R(g, 0, 0, W, H, 34); g.fillStyle = base; g.fill();
        g.save(); R(g, 0, 0, W, H, 34); g.clip();
        g.strokeStyle = 'rgba(255,255,255,0.05)'; g.lineWidth = 1;
        for (var x = CELL * 4; x < W; x += CELL * 4) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
        for (var y = CELL * 4; y < H; y += CELL * 4) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
        [[0, COLORS[0]], [W, COLORS[1]]].forEach(function (s) {
          var gr = g.createRadialGradient(s[0], H / 2, 0, s[0], H / 2, W * 0.5);
          gr.addColorStop(0, s[1] + '26'); gr.addColorStop(1, s[1] + '00');
          g.fillStyle = gr; g.fillRect(0, 0, W, H);
        });
        var vig = g.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, W * 0.65);
        vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.45)');
        g.fillStyle = vig; g.fillRect(0, 0, W, H);
        GameFX.noise(g, W, H, 7000, 0.02);
        g.restore();
        R(g, 3, 3, W - 6, H - 6, 32); g.lineWidth = 5; g.strokeStyle = 'rgba(255,255,255,0.3)'; g.stroke();
      }), 'bg').position.set(W / 2, H / 2);

      // A trail segment: wide soft halo + bright core, stamped once into the decal texture.
      function paintSegment(x0, y0, x1, y1, i) {
        var c = PIXI.utils.string2hex(COLORS[i]), g = new PIXI.Graphics();
        g.lineStyle({ width: CELL * 1.6, color: c, alpha: 0.12, cap: 'round' }); g.moveTo(cx(x0), cy(y0)); g.lineTo(cx(x1), cy(y1));
        g.lineStyle({ width: CELL * 0.85, color: c, alpha: 0.55, cap: 'round' }); g.moveTo(cx(x0), cy(y0)); g.lineTo(cx(x1), cy(y1));
        g.lineStyle({ width: CELL * 0.28, color: 0xffffff, alpha: 0.85, cap: 'round' }); g.moveTo(cx(x0), cy(y0)); g.lineTo(cx(x1), cy(y1));
        fx.decal(g);
      }

      var headTex = fx.texture(120, 120, function (g, w) {
        var gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
        gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.18, 'rgba(255,255,255,0.95)'); gr.addColorStop(0.4, 'rgba(255,255,255,0.35)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = gr; g.fillRect(0, 0, w, w);
      });
      var heads = [0, 1].map(function (i) { return fx.sprite(headTex, 'glow', { add: true, tint: COLORS[i] }); });
      var cores = [0, 1].map(function () { var s = fx.sprite(fx.tex.dot, 'top', { add: true }); s.scale.set(26 / 64); return s; });
      var countText = fx.text('', W / 2, H * 0.4, 0xffffff, 170);
      fx.ambient(40, [0xffffff, COLORS[0], COLORS[1]]);
      var tags = [0, 1].map(function () { return fx.tag(''); });
      var lastPulse = 0;

      function render() {
        var t = performance.now();
        heads.forEach(function (h, i) {
          var r = riders && riders[i];
          h.visible = cores[i].visible = !!r && phase !== 'lobby';
          if (!r) return;
          // Glide between cells so the heads move smoothly even though the grid steps.
          var k = phase === 'play' ? Math.min(1, (Date.now() - lastTick) / tickMs) : 1;
          var x = r.alive ? cx(r.x) + DIRS[r.dir][0] * CELL * k : cx(r.x), y = r.alive ? cy(r.y) + DIRS[r.dir][1] * CELL * k : cy(r.y);
          h.position.set(x, y); cores[i].position.set(x, y);
          h.alpha = r.alive ? 0.9 + 0.1 * Math.sin(t / 90) : 0.25; cores[i].alpha = r.alive ? 1 : 0.2;
          h.scale.set((r.alive ? 1 + 0.08 * Math.sin(t / 120) : 0.7) / fx.px);
          tags[i].text = lobby.solo() && phase !== 'lobby' ? (lobby.isCpu(i) ? 'الكمبيوتر' : 'أنت') : '';
          tags[i].follow(x, y - 44);
        });
        // A soft pulse of light rolls out from each head every second and a half.
        if (riders && phase === 'play' && t - lastPulse > 1500) {
          lastPulse = t;
          riders.forEach(function (r, i) { if (r.alive) fx.ring(cx(r.x), cy(r.y), COLORS[i], 260, 0.9); });
        }
        if (phase === 'countdown') {
          var left = (phaseEnd - Date.now()) / 1000, n = Math.max(1, Math.ceil(left)), f = left - Math.floor(left);
          countText.text = String(n); countText.alpha = 0.3 + 0.7 * f; countText.scale.set((0.8 + 0.5 * f) / fx.px);
        } else countText.text = '';
      }

      fx.app.ticker.add(function () {
        var dt = Math.min(0.1, fx.app.ticker.deltaMS / 1000), now = Date.now();
        if (phase === 'countdown' && now >= phaseEnd) { phase = 'play'; lastTick = now; }
        if (phase === 'between' && now >= phaseEnd) newRound();
        if (phase === 'play') {
          var guard = 0;
          while (now - lastTick >= tickMs && phase === 'play' && guard++ < 4) { lastTick += tickMs; tick(); }
        }
        fx.update(dt);
        render();
      });

      function showScore() {
        document.querySelector('#s0 b').textContent = score[0];
        document.querySelector('#s1 b').textContent = score[1];
      }
      var bannerTimer = null;
      function banner(html, color, ms) {
        var b = document.getElementById('banner');
        b.innerHTML = html; b.style.color = color; b.className = 'show';
        clearTimeout(bannerTimer);
        if (ms) bannerTimer = setTimeout(function () { b.className = ''; }, ms);
      }
      lobby.onHide = function () { document.getElementById('banner').className = ''; };

      var audio = null;
      function sound(freq, dur) {
        try {
          audio = audio || new (window.AudioContext || window.webkitAudioContext)();
          if (audio.state === 'suspended') audio.resume();
          var o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
          o.type = 'sawtooth'; o.frequency.setValueAtTime(freq * 2, t); o.frequency.exponentialRampToValueAtTime(freq / 2, t + dur);
          g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
          o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + dur);
        } catch (e) { /* no audio */ }
      }

      window.trailState = function () {
        return JSON.parse(JSON.stringify({ phase: phase, score: score, riders: riders, tickMs: tickMs }));
      };
    })();
  </script>
</body>
</html>
