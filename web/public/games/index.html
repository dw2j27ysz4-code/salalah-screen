<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ألعاب</title>
  <link rel="stylesheet" href="games.css">
  <style>
    .hub { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5vh; }
    .hub h1 { font-size: 7vh; font-weight: 800; }
    .hub p { font-size: 2.8vh; }
    .cards { display: flex; gap: 4vh; direction: ltr; }
    .card { width: 52vh; height: 40vh; border-radius: 4vh; padding: 3.5vh; display: flex; flex-direction: column; justify-content: flex-end;
      color: #fff; text-decoration: none; direction: rtl; position: relative; overflow: hidden; outline: none;
      transition: transform .2s, box-shadow .2s; }
    .card canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .card b { position: relative; font-size: 5vh; font-weight: 800; }
    .card span { position: relative; font-size: 2.4vh; color: rgba(255,255,255,.78); margin-top: .6vh; }
    .card:focus { transform: scale(1.06); box-shadow: 0 0 0 .5vh #f6cf6a, 0 3vh 7vh rgba(0,0,0,.45); }
  </style>
</head>
<body class="tv">
  <div class="hub">
    <h1>ألعاب لشخصين</h1>
    <div class="cards">
      <a class="card glass" href="hockey.html" id="c0"><canvas id="art0"></canvas><b>هوكي الطاولة</b><span>حرّك المضرب بإصبعك وسجّل في مرمى خصمك</span></a>
      <a class="card glass" href="trail.html" id="c1"><canvas id="art1"></canvas><b>مبارزة الأثر</b><span>وجّه خطّك المضيء وحاصر خصمك</span></a>
    </div>
    <p class="dim">اختر بالأسهم واضغط OK · جوال لكل لاعب</p>
  </div>
  <script>
    // Game picker for the TV remote: arrows move focus between the two cards, OK opens one.
    (function () {
      var cards = [document.getElementById('c0'), document.getElementById('c1')], i = 0;
      cards[0].focus();
      document.addEventListener('keydown', function (e) {
        if (e.keyCode === 37 || e.keyCode === 39) { i = e.keyCode === 37 ? 0 : 1; cards[i].focus(); e.preventDefault(); }
        if (e.keyCode === 13) { location.href = cards[i].getAttribute('href'); e.preventDefault(); }
      });

      // Small static art on each card (drawn once).
      function art(id, draw) {
        var c = document.getElementById(id), r = c.getBoundingClientRect();
        c.width = r.width; c.height = r.height; draw(c.getContext('2d'), c.width, c.height);
      }
      function dot(g, x, y, r, color) {
        g.shadowColor = color; g.shadowBlur = r * 1.2; g.fillStyle = color;
        g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); g.shadowBlur = 0;
      }
      art('art0', function (g, w, h) {
        g.strokeStyle = 'rgba(246,207,106,.5)'; g.lineWidth = 3;
        g.beginPath(); g.moveTo(w / 2, h * 0.1); g.lineTo(w / 2, h * 0.62); g.stroke();
        g.beginPath(); g.arc(w / 2, h * 0.36, h * 0.12, 0, Math.PI * 2); g.stroke();
        dot(g, w * 0.22, h * 0.36, h * 0.07, '#5fd0ff'); dot(g, w * 0.78, h * 0.3, h * 0.07, '#f6cf6a');
        dot(g, w * 0.58, h * 0.44, h * 0.04, '#ffffff');
      });
      art('art1', function (g, w, h) {
        var s = h * 0.035;
        g.lineWidth = s; g.lineJoin = 'round';
        g.strokeStyle = '#5fd0ff'; g.shadowColor = '#5fd0ff'; g.shadowBlur = s * 2;
        g.beginPath(); g.moveTo(w * 0.08, h * 0.5); g.lineTo(w * 0.35, h * 0.5); g.lineTo(w * 0.35, h * 0.15); g.lineTo(w * 0.6, h * 0.15); g.stroke();
        g.strokeStyle = '#f6cf6a'; g.shadowColor = '#f6cf6a';
        g.beginPath(); g.moveTo(w * 0.92, h * 0.25); g.lineTo(w * 0.72, h * 0.25); g.lineTo(w * 0.72, h * 0.55); g.lineTo(w * 0.5, h * 0.55); g.stroke();
        g.shadowBlur = 0;
      });
    })();
  </script>
</body>
</html>
