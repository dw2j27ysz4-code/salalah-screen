<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1c1c1e">
  <title>يد التحكم</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; background: linear-gradient(#3a3b40, #161618); color: #fff;
      font-family: -apple-system, 'SF Arabic', 'Segoe UI', Tahoma, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
    #top { position: fixed; top: 0; left: 0; right: 0; padding: max(14px, env(safe-area-inset-top)) 18px 10px;
      display: flex; align-items: center; justify-content: space-between; font-size: 17px; }
    #who { font-weight: 700; display: flex; align-items: center; gap: 8px; }
    #who i { width: 16px; height: 16px; border-radius: 50%; background: #888; display: inline-block; }
    #net { font-size: 12px; color: rgba(255,255,255,.55); }
    #msg { position: fixed; left: 0; right: 0; top: 54px; text-align: center; color: rgba(255,255,255,.75); font-size: 15px; padding: 0 16px; }
    /* Hockey: a touch area shaped like your half of the table, goal on the outer edge. */
    #area { position: fixed; border-radius: 28px; display: none;
      background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.05)); border: 1px solid rgba(255,255,255,.28); }
    #area .goal { position: absolute; top: 33%; height: 34%; width: 8px; border-radius: 4px; }
    #area .mid { position: absolute; top: 4%; bottom: 4%; width: 3px; background: rgba(246,207,106,.5); }
    #knob { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; display: none; }
    /* Trail duel: a big four-way pad (directions match the TV), swiping works anywhere too. */
    #turns { position: fixed; display: none; direction: ltr;
      grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 10px; }
    #turns button { border: 1px solid rgba(255,255,255,.25); border-radius: 26px; color: #fff; font-size: 40px; font-family: inherit;
      background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.05)); }
    #turns button.on { background: rgba(255,255,255,.45); }
    #turns .u { grid-column: 2; grid-row: 1; } #turns .l { grid-column: 1; grid-row: 2; }
    #turns .r { grid-column: 3; grid-row: 2; } #turns .d { grid-column: 2; grid-row: 3; }
    /* Race: two halves to steer (both = brake); tilt steering when the phone allows it. */
    #race { position: fixed; left: 0; right: 0; bottom: 0; top: 90px; display: none; direction: ltr; gap: 12px; padding: 12px; }
    #race div { flex: 1; border-radius: 28px; border: 1px solid rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center;
      font-size: 54px; background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.05)); }
    #race div.on { background: rgba(255,255,255,.42); }
    #tilt { position: fixed; left: 50%; top: 92px; transform: translateX(-50%); display: none; z-index: 2;
      font-size: 15px; font-family: inherit; color: #fff; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 8px 18px; }
    /* Tank: joystick appears where the left thumb lands; fire button on the right. */
    #tank { position: fixed; left: 0; right: 0; bottom: 0; top: 90px; display: none; direction: ltr; }
    #stickZone { position: absolute; left: 0; top: 0; bottom: 0; width: 58%; display: flex; align-items: center; justify-content: center; }
    #stickZone::before { content: 'ضع إبهامك هنا للتحريك'; color: rgba(255,255,255,.4); font-size: 15px; padding: 70px 18px;
      border: 2px dashed rgba(255,255,255,.18); border-radius: 50%; width: 150px; text-align: center; direction: rtl; }
    #stickBase, #stickKnob { position: absolute; border-radius: 50%; display: none; pointer-events: none; }
    #stickBase { width: 150px; height: 150px; margin: -75px 0 0 -75px; border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08); }
    #stickKnob { width: 70px; height: 70px; margin: -35px 0 0 -35px; }
    #fire { position: absolute; right: 18px; top: 50%; width: 36%; aspect-ratio: 1; transform: translateY(-50%); border-radius: 50%;
      border: 0; font-size: 26px; font-weight: 800; font-family: inherit; color: #1a1330; }
    #fire.on { filter: brightness(1.3); transform: translateY(-50%) scale(.94); }
    #solo { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: none; z-index: 3;
      font-weight: 700; font-size: 19px; font-family: inherit; color: #fff; background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,.1));
      border: 1px solid rgba(255,255,255,.45); border-radius: 999px; padding: 14px 30px; white-space: nowrap; }
    #again { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: none;
      font-weight: 700; font-size: 20px; font-family: inherit; color: #1a1330; background: #f6cf6a; border: 0; border-radius: 999px; padding: 14px 34px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="link.js"></script>
</head>
<body>
  <div id="top"><div id="who"><i></i><span>جارٍ الاتصال…</span></div><div id="net"></div></div>
  <div id="msg">انتظر قليلاً…</div>
  <div id="area"><div class="mid"></div><div class="goal"></div><div id="knob"></div></div>
  <div id="turns">
    <button class="u" data-d="u">▲</button><button class="l" data-d="l">◀</button>
    <button class="r" data-d="r">▶</button><button class="d" data-d="d">▼</button>
  </div>
  <div id="race"><div id="rl">◀</div><div id="rr">▶</div></div>
  <button id="tilt">التوجيه بإمالة الجوال</button>
  <div id="tank"><div id="stickZone"></div><div id="stickBase"></div><div id="stickKnob"></div><button id="fire">إطلاق</button></div>
  <button id="solo">العب ضد الكمبيوتر 🤖</button>
  <button id="again">مباراة جديدة</button>
  <script>
    // Phone controller for the TV games: hockey (finger position in your half of the table),
    // trail (four directions), race (steer by tilt or screen halves), tank (joystick + fire).
    (function () {
      'use strict';
      var q = new URLSearchParams(location.search), game = q.get('game'), room = q.get('room');
      var slot = -1, color = '#888';
      var HINTS = {
        hockey: 'اسحب إصبعك لتحريك المضرب',
        trail: 'الأسهم أو السحب لتغيير الاتجاه',
        race: 'المس يمين/يسار للتوجيه · الاثنين معاً للفرامل',
        tank: 'حرّك بالإبهام الأيسر وأطلق بالأيمن',
      };
      var $ = function (id) { return document.getElementById(id); };

      var link = GameLink.join(room, function (m) {
        if (m.t === 'slot') {
          if (slot !== m.slot) { slot = m.slot; color = m.color; setup(m); }
          $('solo').style.display = m.phase === 'lobby' ? 'block' : 'none';
        } else if (m.t === 'full') {
          $('msg').textContent = 'اللعبة ممتلئة: يوجد لاعبان بالفعل';
        } else if (m.t === 'buzz') {
          if (navigator.vibrate) navigator.vibrate(m.ms || 20);
        } else if (m.t === 'state') {
          if (m.phase === 'over') {
            $('msg').textContent = m.winner === slot ? 'فزت! 🎉' : (m.solo ? 'فاز الكمبيوتر هذه المرة' : 'خسرت هذه المرة');
            $('again').style.display = 'block';
          } else {
            $('again').style.display = 'none'; $('solo').style.display = 'none';
            $('msg').textContent = HINTS[game] || '';
          }
        }
      }, function () { $('net').textContent = link.via() === 'p2p' ? 'اتصال مباشر' : 'اتصال عبر الإنترنت'; });

      // Ask for a seat until we get one, then keep a heartbeat so the TV knows we're here.
      setInterval(function () { link.send({ t: 'hello' }); }, 1000);
      link.send({ t: 'hello' });

      function setup(m) {
        $('who').innerHTML = '<i style="background:' + color + ';box-shadow:0 0 10px ' + color + '"></i><span>' + m.name + '</span>';
        $('msg').textContent = m.phase === 'play' ? '' : 'بانتظار اللاعب الثاني…';
        ({ hockey: setupHockey, trail: setupTrail, race: setupRace, tank: setupTank })[game]();
      }

      // ---- Hockey ----
      var pending = null;
      function setupHockey() {
        var area = $('area'), top = 90, pad = 16;
        var aw = innerWidth - pad * 2, ah = innerHeight - top - pad - 70;
        var ratio = 8 / 9; // half of a 16:9 table
        var w = Math.min(aw, ah * ratio), h = w / ratio;
        area.style.cssText = 'display:block;width:' + w + 'px;height:' + h + 'px;left:' + ((innerWidth - w) / 2) + 'px;top:' + (top + (ah - h) / 2) + 'px';
        var goal = area.querySelector('.goal'), mid = area.querySelector('.mid');
        goal.style.background = color; goal.style.boxShadow = '0 0 14px ' + color;
        // Same orientation as the TV: left player's goal on the left, right player's on the right.
        if (slot === 0) { goal.style.left = '-4px'; mid.style.right = '0'; } else { goal.style.right = '-4px'; mid.style.left = '0'; }
        var knob = $('knob');
        knob.style.background = color; knob.style.boxShadow = '0 0 20px ' + color;

        function onTouch(e) {
          var t = e.touches ? e.touches[0] : e, r = area.getBoundingClientRect();
          if (!t) return;
          var x = Math.max(0, Math.min(1, (t.clientX - r.left) / r.width));
          var y = Math.max(0, Math.min(1, (t.clientY - r.top) / r.height));
          knob.style.display = 'block'; knob.style.left = (x * 100) + '%'; knob.style.top = (y * 100) + '%';
          queue({ t: 'move', x: x, y: y });
          e.preventDefault();
        }
        document.addEventListener('touchstart', onTouch, { passive: false });
        document.addEventListener('touchmove', onTouch, { passive: false });
        document.addEventListener('mousemove', function (e) { if (e.buttons) onTouch(e); });
        document.addEventListener('mousedown', onTouch);
      }

      // Send each position straight away (lowest latency), at most every 12 ms;
      // a position that arrives sooner is sent when the 12 ms are up.
      var lastSent = 0, flushTimer = null;
      function queue(msg) {
        pending = msg;
        var wait = 12 - (Date.now() - lastSent);
        if (wait <= 0) flush();
        else if (!flushTimer) flushTimer = setTimeout(flush, wait);
      }
      function flush() {
        flushTimer = null;
        if (!pending) return;
        link.send(pending); pending = null; lastSent = Date.now();
      }

      // ---- Trail duel ----
      function setupTrail() {
        var pad = $('turns'), size = Math.min(innerWidth - 32, innerHeight - 170);
        pad.style.cssText = 'display:grid;width:' + size + 'px;height:' + size + 'px;left:' + ((innerWidth - size) / 2) +
          'px;top:' + (100 + (innerHeight - 170 - size) / 2) + 'px';
        function turn(d) { link.send({ t: 'turn', d: d }); if (navigator.vibrate) navigator.vibrate(10); }
        Array.prototype.forEach.call(pad.querySelectorAll('button'), function (el) {
          function press(e) { e.preventDefault(); e.stopPropagation(); el.classList.add('on'); turn(el.getAttribute('data-d')); }
          function release() { el.classList.remove('on'); }
          el.addEventListener('touchstart', press, { passive: false });
          el.addEventListener('mousedown', press);
          el.addEventListener('touchend', release); el.addEventListener('mouseup', release);
        });
        // Swipe anywhere outside the buttons: the dominant axis picks the direction.
        var sx = 0, sy = 0;
        document.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
        document.addEventListener('touchend', function (e) {
          if (e.target.closest && e.target.closest('#turns button')) return; // a button press, not a swipe
          var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
          if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
          turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'r' : 'l') : (dy > 0 ? 'd' : 'u'));
        });
      }

      // ---- Race ----
      function setupRace() {
        $('race').style.display = 'flex';
        var held = { l: false, r: false }, tilt = null;
        function send() {
          var s = tilt !== null ? tilt : (held.r ? 1 : 0) - (held.l ? 1 : 0);
          queue({ t: 'steer', s: Math.round(s * 100) / 100, b: held.l && held.r ? 1 : 0 });
        }
        [['rl', 'l'], ['rr', 'r']].forEach(function (p) {
          var el = $(p[0]);
          function down(e) { e.preventDefault(); held[p[1]] = true; el.className = 'on'; send(); }
          function up() { held[p[1]] = false; el.className = ''; send(); }
          el.addEventListener('touchstart', down, { passive: false }); el.addEventListener('mousedown', down);
          el.addEventListener('touchend', up); el.addEventListener('touchcancel', up); el.addEventListener('mouseup', up);
        });
        // Tilt: holding the phone upright like a steering wheel, gamma is the left/right lean.
        function onTilt(e) {
          if (e.gamma === null) return;
          var s = Math.max(-1, Math.min(1, e.gamma / 30));
          tilt = Math.abs(s) < 0.08 ? 0 : s;
          send();
        }
        function enableTilt() {
          window.addEventListener('deviceorientation', onTilt);
          $('tilt').textContent = 'التوجيه بالإمالة مفعّل ✓';
        }
        if (window.DeviceOrientationEvent) {
          $('tilt').style.display = 'block';
          $('tilt').addEventListener('click', function () {
            // iPhone asks for permission and only after a tap.
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
              DeviceOrientationEvent.requestPermission().then(function (r) { if (r === 'granted') enableTilt(); }).catch(function () {});
            } else enableTilt();
          });
        }
        setInterval(send, 250); // keep the TV in sync even when nothing changes
      }

      // ---- Tank ----
      function setupTank() {
        $('tank').style.display = 'block';
        var zone = $('stickZone'), base = $('stickBase'), knob = $('stickKnob'), fireBtn = $('fire');
        fireBtn.style.background = color; fireBtn.style.boxShadow = '0 0 28px ' + color;
        knob.style.background = color; knob.style.boxShadow = '0 0 18px ' + color;
        var stickId = null, ox = 0, oy = 0, R = 75;
        function place(x, y) {
          var dx = x - ox, dy = y - oy, d = Math.sqrt(dx * dx + dy * dy), k = d > R ? R / d : 1;
          knob.style.left = (ox + dx * k) + 'px'; knob.style.top = (oy + dy * k - 90) + 'px';
          queue({ t: 'stick', x: Math.round(dx * k / R * 100) / 100, y: Math.round(dy * k / R * 100) / 100 });
        }
        zone.addEventListener('touchstart', function (e) {
          e.preventDefault();
          var t = e.changedTouches[0]; stickId = t.identifier; ox = t.clientX; oy = t.clientY;
          base.style.display = knob.style.display = 'block';
          base.style.left = ox + 'px'; base.style.top = (oy - 90) + 'px';
          place(ox, oy);
        }, { passive: false });
        document.addEventListener('touchmove', function (e) {
          for (var i = 0; i < e.changedTouches.length; i++) if (e.changedTouches[i].identifier === stickId) place(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
          e.preventDefault();
        }, { passive: false });
        function release(e) {
          for (var i = 0; i < e.changedTouches.length; i++) if (e.changedTouches[i].identifier === stickId) {
            stickId = null; base.style.display = knob.style.display = 'none'; queue({ t: 'stick', x: 0, y: 0 });
          }
        }
        document.addEventListener('touchend', release); document.addEventListener('touchcancel', release);
        // Mouse fallback for testing on a computer.
        var mouseDown = false;
        zone.addEventListener('mousedown', function (e) { mouseDown = true; ox = e.clientX; oy = e.clientY; base.style.display = knob.style.display = 'block';
          base.style.left = ox + 'px'; base.style.top = (oy - 90) + 'px'; place(ox, oy); });
        document.addEventListener('mousemove', function (e) { if (mouseDown) place(e.clientX, e.clientY); });
        document.addEventListener('mouseup', function () { if (mouseDown) { mouseDown = false; base.style.display = knob.style.display = 'none'; queue({ t: 'stick', x: 0, y: 0 }); } });

        function fire(e) { e.preventDefault(); e.stopPropagation(); fireBtn.className = 'on'; link.send({ t: 'fire' }); if (navigator.vibrate) navigator.vibrate(15); }
        fireBtn.addEventListener('touchstart', fire, { passive: false }); fireBtn.addEventListener('mousedown', fire);
        fireBtn.addEventListener('touchend', function () { fireBtn.className = ''; }); fireBtn.addEventListener('mouseup', function () { fireBtn.className = ''; });
      }

      $('solo').addEventListener('click', function () { link.send({ t: 'solo' }); $('solo').style.display = 'none'; $('msg').textContent = 'جارٍ البدء ضد الكمبيوتر…'; });
      $('again').addEventListener('click', function () { link.send({ t: 'again' }); $('again').style.display = 'none'; });
    })();
  </script>
</body>
</html>
