<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>سباق السيارات</title>
  <link rel="stylesheet" href="games.css">
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
  <script src="link.js"></script>
  <script src="lobby.js"></script>
  <script src="fx.js"></script>
</head>
<body class="tv">
  <div id="hud">
    <div class="score" id="s1"><span class="dotc gold"></span><b>0/3</b></div>
    <div class="hud-title">سباق السيارات <span class="dim">· 3 لفّات</span></div>
    <div class="score" id="s0"><b>0/3</b><span class="dotc cyan"></span></div>
  </div>
  <div id="stage"></div>
  <div id="banner"></div>
  <div id="lobby" class="lobby glass"></div>

  <script>
    // TV side of the car race: a top-down circuit, arcade physics. Cars accelerate on their
    // own; phones send steering (-1..1, tilt or touch) and brake. Off the asphalt is slow.
    // Rendering: PixiJS via fx.js (textured circuit, skid marks, dust, start lights).
    (function () {
      'use strict';
      var W = 1600, H = 900, TRACK_W = 150, LAPS = 3, CAR_R = 22;
      var MAX_SPEED = 560, OFF_SPEED = 230, ACCEL = 380, BRAKE = 1100, TURN = 2.7;
      var COLORS = ['#5fd0ff', '#f6cf6a'];

      // Circuit centreline: closed Catmull-Rom spline through these points (table units).
      var CTRL = [[300, 700], [180, 450], [330, 170], [640, 140], [800, 330], [980, 150], [1310, 160],
        [1450, 380], [1290, 560], [1420, 760], [1100, 790], [800, 640], [560, 790]];
      var PATH = sampleSpline(CTRL, 520), N = PATH.length;

      var cars = null, phase = 'lobby', phaseEnd = 0, finished = [];

      var lobby = Lobby.create({
        game: 'race',
        title: 'سباق السيارات',
        hint: 'أمِل الجوال للتوجيه، أو المس نصف الشاشة الأيمن/الأيسر · المس الاثنين للفرامل',
        slots: [{ name: 'الأزرق', color: COLORS[0] }, { name: 'الذهبي', color: COLORS[1] }],
        onInput: function (slot, m) {
          if (m.t !== 'steer' || !cars) return;
          cars[slot].steer = Math.max(-1, Math.min(1, +m.s || 0));
          cars[slot].brake = !!m.b;
        },
        onReady: function () { newRace(); },
        onAgain: function () { if (phase === 'over') newRace(); },
        onLeft: function () { phase = 'lobby'; },
      });

      function sampleSpline(pts, n) {
        var out = [], m = pts.length;
        for (var i = 0; i < n; i++) {
          var t = i / n * m, k = Math.floor(t), u = t - k;
          var p0 = pts[(k - 1 + m) % m], p1 = pts[k % m], p2 = pts[(k + 1) % m], p3 = pts[(k + 2) % m];
          var u2 = u * u, u3 = u2 * u;
          out.push([0, 1].map(function (j) {
            return 0.5 * (2 * p1[j] + (-p0[j] + p2[j]) * u + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * u2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * u3);
          }));
        }
        return out;
      }

      function newRace() {
        // Grid just past the line, so the first crossing is the end of lap 1.
        var START = 6, a = PATH[START], b = PATH[START + 3], ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
        var nx = -Math.sin(ang), ny = Math.cos(ang);
        cars = [0, 1].map(function (i) {
          var off = (i === 0 ? -1 : 1) * 38;
          return { x: a[0] + nx * off, y: a[1] + ny * off, a: ang, v: 0,
            steer: 0, brake: false, idx: START, lap: 0, done: false, onTrack: true };
        });
        finished = [];
        showLaps();
        fx.clearDecals();
        phase = 'countdown'; phaseEnd = Date.now() + 3000;
        lobby.broadcast({ t: 'state', phase: 'play' });
      }

      // Nearest centreline sample, searched around the last known one (cars move a few per frame).
      function nearest(c) {
        var best = c.idx, bd = Infinity;
        for (var k = -25; k <= 25; k++) {
          var i = (c.idx + k + N) % N, dx = PATH[i][0] - c.x, dy = PATH[i][1] - c.y, d = dx * dx + dy * dy;
          if (d < bd) { bd = d; best = i; }
        }
        return [best, Math.sqrt(bd)];
      }

      // Computer driver: aim at a point further along the centreline (further when faster),
      // brake when the road well ahead turns sharply. Capped a little below full speed.
      var CPU_TOP = 0.9;
      function cpuDrive(c) {
        var look = Math.round(8 + c.v / 28);
        var t = PATH[(c.idx + look) % N], want = Math.atan2(t[1] - c.y, t[0] - c.x);
        var diff = Math.atan2(Math.sin(want - c.a), Math.cos(want - c.a));
        c.steer = Math.max(-1, Math.min(1, diff * 2.4));
        var f = PATH[(c.idx + look * 2 + 18) % N], fa = Math.atan2(f[1] - c.y, f[0] - c.x);
        var fd = Math.abs(Math.atan2(Math.sin(fa - c.a), Math.cos(fa - c.a)));
        c.brake = fd > 0.85 && c.v > 360;
      }

      function step(dt) {
        cars.forEach(function (c, i) {
          if (lobby.isCpu(i) && !c.done) cpuDrive(c);
          if (c.done) { c.v *= 0.96; }
          var near = nearest(c), onTrack = near[1] < TRACK_W / 2;
          c.onTrack = onTrack;
          var top = (onTrack ? MAX_SPEED : OFF_SPEED) * (lobby.isCpu(i) ? CPU_TOP : 1);
          if (!c.done) {
            if (c.brake) c.v -= BRAKE * dt; else c.v += ACCEL * dt;
          }
          if (c.v > top) c.v -= (onTrack ? 300 : 900) * dt;
          c.v = Math.max(0, c.v);
          c.a += c.steer * TURN * dt * Math.min(1, c.v / 160);
          c.x += Math.cos(c.a) * c.v * dt; c.y += Math.sin(c.a) * c.v * dt;
          c.x = Math.max(CAR_R, Math.min(W - CAR_R, c.x)); c.y = Math.max(CAR_R, Math.min(H - CAR_R, c.y));
          // Laps: crossing sample 0 forwards counts, backwards un-counts (no shortcut by reversing).
          var prev = c.idx; c.idx = near[0];
          if (prev > N * 0.85 && c.idx < N * 0.15) lapDone(c, i);
          else if (prev < N * 0.15 && c.idx > N * 0.85) c.lap = Math.max(0, c.lap - 1);
        });
        // Car-to-car bump.
        var A = cars[0], B = cars[1], dx = B.x - A.x, dy = B.y - A.y, d = Math.sqrt(dx * dx + dy * dy);
        if (d > 0 && d < CAR_R * 2) {
          var push = (CAR_R * 2 - d) / 2, ux = dx / d, uy = dy / d;
          A.x -= ux * push; A.y -= uy * push; B.x += ux * push; B.y += uy * push;
          A.v *= 0.9; B.v *= 0.9;
          if (Date.now() - lastBump > 400) {
            lastBump = Date.now(); sound(120, 0.12);
            lobby.send(0, { t: 'buzz', ms: 40 }); lobby.send(1, { t: 'buzz', ms: 40 });
            fx.emit({ x: (A.x + B.x) / 2, y: (A.y + B.y) / 2, count: 14, color: [0xffe08a, 0xffffff], tex: 'spark', speed: [200, 700], life: [0.15, 0.35], size: 26, drag: 4 });
            fx.shake(6, 150);
          }
        }
      }
      var lastBump = 0;

      function lapDone(c, i) {
        if (c.done) return;
        c.lap++; showLaps();
        sound(660, 0.15);
        lobby.send(i, { t: 'buzz', ms: 60 });
        fx.ring(c.x, c.y, COLORS[i], 220, 0.5);
        if (c.lap >= LAPS) {
          c.done = true; finished.push(i);
          if (finished.length === 1) {
            banner((i === 0 ? 'الأزرق' : 'الذهبي') + ' يفوز!', COLORS[i], 0);
            phase = 'over';
            lobby.broadcast({ t: 'state', phase: 'over', winner: i, solo: lobby.solo() });
            var a = PATH[0];
            fx.emit({ x: a[0], y: a[1], count: 90, color: [COLORS[i], 0xffffff, 0xd64034], tex: 'square', add: false,
              speed: [200, 900], life: [1, 2], size: 14, gravity: 500, drag: 1.2, spin: 14 });
            fx.flash(0.3); fx.shake(14, 400);
          }
        } else if (c.lap === LAPS - 1) {
          banner('اللفة الأخيرة', COLORS[i], 1200);
        }
      }

      // ---- Look ----
      var fx = GameFX.create(document.getElementById('stage'), W, H);

      function tracePath(g) {
        g.beginPath();
        PATH.forEach(function (p, i) { if (i) g.lineTo(p[0], p[1]); else g.moveTo(p[0], p[1]); });
        g.closePath();
      }
      function stroke(g, width, style, dash) {
        tracePath(g); g.lineWidth = width; g.strokeStyle = style; g.lineJoin = 'round';
        g.setLineDash(dash || []); g.stroke(); g.setLineDash([]);
      }

      // Circuit art, baked once: grass with mowing stripes, trees with shadows, kerbs, textured asphalt.
      fx.sprite(fx.texture(W, H, function (g) {
        var R = GameFX.roundRect;
        R(g, 0, 0, W, H, 40); g.save(); g.clip();
        var grass = g.createLinearGradient(0, 0, W, H);
        grass.addColorStop(0, '#3f5a3a'); grass.addColorStop(1, '#2c4229');
        g.fillStyle = grass; g.fillRect(0, 0, W, H);
        for (var s = -H; s < W; s += 90) { g.fillStyle = 'rgba(255,255,255,0.025)'; g.beginPath(); g.moveTo(s, 0); g.lineTo(s + 45, 0); g.lineTo(s + 45 + H, H); g.lineTo(s + H, H); g.closePath(); g.fill(); }
        GameFX.noise(g, W, H, 14000, 0.035);
        // Track shadow, kerbs, asphalt, edge lines.
        g.shadowColor = 'rgba(0,0,0,0.5)'; g.shadowBlur = 24; g.shadowOffsetY = 8;
        stroke(g, TRACK_W + 22, '#2a2b2f'); g.shadowColor = 'transparent';
        stroke(g, TRACK_W + 18, '#f2f2f2', [24, 24]);
        stroke(g, TRACK_W + 18, '#d64034', [0, 24, 24, 0]);
        var asph = g.createLinearGradient(0, 0, 0, H);
        asph.addColorStop(0, '#3a3b40'); asph.addColorStop(1, '#2c2d31');
        stroke(g, TRACK_W, asph);
        stroke(g, TRACK_W - 14, 'rgba(255,255,255,0.75)'); stroke(g, TRACK_W - 18, '#34353a');
        stroke(g, 3, 'rgba(255,255,255,0.35)', [34, 30]);
        // Trees: away from the track, with soft drop shadows and a lit crown.
        var placed = 0, tries = 0;
        while (placed < 46 && tries++ < 2000) {
          var x = 30 + Math.random() * (W - 60), y = 30 + Math.random() * (H - 60), r = 16 + Math.random() * 18, ok = true;
          for (var i = 0; i < N; i += 4) { var dx = PATH[i][0] - x, dy = PATH[i][1] - y; if (dx * dx + dy * dy < Math.pow(TRACK_W / 2 + r + 30, 2)) { ok = false; break; } }
          if (!ok) continue;
          placed++;
          g.fillStyle = 'rgba(0,0,0,0.35)'; g.beginPath(); g.ellipse(x + r * 0.45, y + r * 0.55, r, r * 0.85, 0, 0, Math.PI * 2); g.fill();
          var crown = g.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
          crown.addColorStop(0, '#7fae5c'); crown.addColorStop(0.6, '#3f6e33'); crown.addColorStop(1, '#25451f');
          g.fillStyle = crown; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
        }
        g.restore();
        // Start/finish chequer across the track at sample 0, and grid boxes.
        var a = PATH[0], b = PATH[3], ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
        g.save(); g.translate(a[0], a[1]); g.rotate(ang);
        for (var rr = 0; rr < 2; rr++) for (var k = -5; k < 5; k++) {
          g.fillStyle = (rr + k) % 2 ? '#ffffff' : '#111111'; g.fillRect(rr * 14 - 14, k * 14, 14, 14);
        }
        g.restore();
        R(g, 3, 3, W - 6, H - 6, 38); g.lineWidth = 5; g.strokeStyle = 'rgba(255,255,255,0.3)'; g.stroke();
      }), 'bg').position.set(W / 2, H / 2);

      function carTex(color) {
        var L = 56, Wd = 30, pad = 10;
        return fx.texture(L + pad * 2, Wd + pad * 2, function (g) {
          var x = pad, y = pad, R = GameFX.roundRect;
          g.fillStyle = '#111'; [[x + 8, y - 3], [x + L - 18, y - 3], [x + 8, y + Wd - 5], [x + L - 18, y + Wd - 5]].forEach(function (w) { R(g, w[0], w[1], 12, 8, 3); g.fill(); });
          var body = g.createLinearGradient(0, y, 0, y + Wd);
          body.addColorStop(0, '#ffffff'); body.addColorStop(0.2, color); body.addColorStop(1, '#1d2433');
          R(g, x, y + 1, L, Wd - 2, 10); g.fillStyle = body; g.fill();
          g.fillStyle = 'rgba(255,255,255,0.85)'; g.fillRect(x + 4, y + Wd / 2 - 3, L - 10, 6);               // racing stripe
          g.fillStyle = 'rgba(15,20,35,0.85)'; R(g, x + L * 0.42, y + 5, L * 0.26, Wd - 10, 5); g.fill();       // cockpit glass
          g.fillStyle = 'rgba(255,255,255,0.35)'; R(g, x + L * 0.47, y + 7, L * 0.08, Wd - 14, 2); g.fill();
          g.fillStyle = '#1a1a1a'; R(g, x - 2, y + 2, 6, Wd - 4, 2); g.fill();                                  // rear wing
          g.fillStyle = '#fff6c8'; g.fillRect(x + L - 3, y + 4, 3, 6); g.fillRect(x + L - 3, y + Wd - 10, 3, 6); // headlights
        });
      }
      var beamTex = fx.texture(180, 90, function (g, w, h) {
        var gr = g.createLinearGradient(0, 0, w, 0);
        gr.addColorStop(0, 'rgba(255,250,220,0.55)'); gr.addColorStop(1, 'rgba(255,250,220,0)');
        g.fillStyle = gr; g.beginPath(); g.moveTo(0, h / 2 - 8); g.lineTo(w, 0); g.lineTo(w, h); g.lineTo(0, h / 2 + 8); g.closePath(); g.fill();
      });
      var carSprites = COLORS.map(function (c) { return fx.sprite(carTex(c), 'obj'); });
      var shadows = COLORS.map(function () { var s = fx.sprite(fx.tex.shadow, 'shadow'); s.scale.set(1.0, 0.6); return s; });
      var beams = COLORS.map(function () { var s = fx.sprite(beamTex, 'glow', { add: true }); s.anchor.set(0, 0.5); s.alpha = 0.5; return s; });
      var brakes = COLORS.map(function () { var s = fx.sprite(fx.tex.dot, 'glow', { add: true, tint: 0xff3020 }); s.scale.set(34 / 64); return s; });

      // Formula 1 style start lights: five reds come on one by one, then all go out.
      var lights = new PIXI.Container(); fx.layers.top.addChild(lights); lights.position.set(W / 2, 90);
      var panel = new PIXI.Graphics(); panel.beginFill(0x111114, 0.92).lineStyle(3, 0xffffff, 0.25).drawRoundedRect(-200, -42, 400, 84, 22).endFill(); lights.addChild(panel);
      var bulbs = [0, 1, 2, 3, 4].map(function (i) {
        var s = new PIXI.Sprite(fx.tex.dot); s.anchor.set(0.5); s.blendMode = PIXI.BLEND_MODES.ADD;
        s.scale.set(90 / 64); s.position.set(-150 + i * 75, 0); s.tint = 0xff2a1a; lights.addChild(s);
        var g = new PIXI.Graphics(); g.beginFill(0x2a0d0b).drawCircle(-150 + i * 75, 0, 22).endFill(); lights.addChildAt(g, 1);
        return s;
      });
      lights.visible = false;
      var goUntil = 0;

      // Cloud shadows drifting slowly across the circuit, over everything.
      var clouds = [0, 1, 2, 3].map(function (i) {
        var s = new PIXI.Sprite(fx.tex.smoke); s.anchor.set(0.5); s.tint = 0x000000; s.alpha = 0.22;
        s.scale.set((420 + i * 90) / 96, (300 + i * 60) / 96);
        s.position.set(Math.random() * W, Math.random() * H); s.vx = 14 + i * 5; s.vy = 4 + i;
        fx.layers.top.addChildAt(s, 0); return s;
      });
      fx.ambient(24, [0xffffff, 0xfff1c0]);
      // Position badges (1st / 2nd) and solo name tags above the cars.
      var badges = [0, 1].map(function (i) { return fx.tag('', COLORS[i]); });

      function render(dt) {
        cars && cars.forEach(function (c, i) {
          var s = carSprites[i];
          s.visible = shadows[i].visible = beams[i].visible = true;
          s.position.set(c.x, c.y); s.rotation = c.a;
          shadows[i].position.set(c.x + 6, c.y + 9); shadows[i].rotation = c.a;
          beams[i].position.set(c.x + Math.cos(c.a) * 26, c.y + Math.sin(c.a) * 26); beams[i].rotation = c.a;
          var bx = c.x - Math.cos(c.a) * 30, by = c.y - Math.sin(c.a) * 30;
          brakes[i].position.set(bx, by); brakes[i].alpha = c.brake ? 0.95 : 0.25;
          // Tyre marks when cornering hard or braking; dust when on the grass.
          var hard = (Math.abs(c.steer) > 0.6 && c.v > 300) || (c.brake && c.v > 150);
          if (hard && phase !== 'countdown') {
            var mk = new PIXI.Graphics(), px = -Math.sin(c.a) * 11, py = Math.cos(c.a) * 11;
            mk.beginFill(0x000000, 0.22).drawCircle(bx + px, by + py, 3.5).drawCircle(bx - px, by - py, 3.5).endFill();
            fx.decal(mk);
          }
          if (!c.onTrack && c.v > 80 && Math.random() < 0.6) {
            fx.emit({ x: bx, y: by, count: 1, color: 0xb8a27a, tex: 'smoke', add: false, speed: [10, 60], life: [0.5, 1.0], size: 46, grow: 70, alpha: 0.5 });
          }
          if (c.v > 120 && Math.random() < 0.15) {
            fx.emit({ x: bx, y: by, count: 1, color: 0xd0d0d0, tex: 'smoke', add: false, speed: [5, 30], life: [0.3, 0.6], size: 18, grow: 40, alpha: 0.25 });
          }
        });
        if (!cars) { carSprites.concat(shadows, beams, brakes).forEach(function (s) { s.visible = false; }); }
        clouds.forEach(function (s) {
          s.x += s.vx * dt; s.y += s.vy * dt;
          if (s.x > W + 300) { s.x = -300; s.y = Math.random() * H; }
          if (s.y > H + 200) s.y = -200;
        });
        badges.forEach(function (b, i) {
          if (!cars || phase === 'lobby') { b.text = ''; return; }
          var me = cars[i], other = cars[1 - i];
          var ahead = me.lap * N + ((me.idx - 6 + N) % N) >= other.lap * N + ((other.idx - 6 + N) % N);
          var who = lobby.solo() ? (lobby.isCpu(i) ? 'الكمبيوتر' : 'أنت') + ' · ' : '';
          b.text = who + (ahead ? 'الأول' : 'الثاني');
          b.follow(me.x, me.y - 46);
        });
        var now = Date.now();
        if (phase === 'countdown') {
          lights.visible = true;
          var lit = Math.min(5, Math.floor((3000 - (phaseEnd - now)) / 550) + 1);
          bulbs.forEach(function (b, i) { b.alpha = i < lit ? 1 : 0; });
          goUntil = phaseEnd + 700;
        } else if (now < goUntil) {
          bulbs.forEach(function (b) { b.alpha = 0; }); // lights out: go!
        } else lights.visible = false;
      }

      var acc = 0, STEP = 1 / 120;
      fx.app.ticker.add(function () {
        var dt = Math.min(0.1, fx.app.ticker.deltaMS / 1000);
        if (phase === 'countdown' && Date.now() >= phaseEnd) { phase = 'play'; sound(880, 0.35); }
        acc += dt;
        while (acc >= STEP) { if (cars && (phase === 'play' || phase === 'over')) step(STEP); acc -= STEP; }
        fx.update(dt);
        render(dt);
      });

      function showLaps() {
        [0, 1].forEach(function (i) {
          document.querySelector('#s' + i + ' b').textContent = Math.min(LAPS, cars ? cars[i].lap : 0) + '/' + LAPS;
        });
      }
      var bannerTimer = null;
      function banner(html, color, ms) {
        var b = document.getElementById('banner');
        b.innerHTML = html + (ms ? '' : '<small>اضغط «مباراة جديدة» على الجوال</small>'); b.style.color = color; b.className = 'show';
        clearTimeout(bannerTimer);
        if (ms) bannerTimer = setTimeout(function () { b.className = ''; }, ms);
      }
      lobby.onHide = function () { document.getElementById('banner').className = ''; };

      var audio = null;
      function sound(freq, dur) {
        try {
          audio = audio || new (window.AudioContext || window.webkitAudioContext)();
          if (audio.state === 'suspended') audio.resume();
          var o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
          o.type = 'triangle'; o.frequency.value = freq;
          g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
          o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + dur);
        } catch (e) { /* no audio */ }
      }

      window.raceState = function () { return JSON.parse(JSON.stringify({ phase: phase, cars: cars, finished: finished })); };
    })();
  </script>
</body>
</html>
