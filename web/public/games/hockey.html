<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>هوكي الطاولة</title>
  <link rel="stylesheet" href="games.css">
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="link.js"></script>
  <script src="lobby.js"></script>
</head>
<body class="tv">
  <div id="hud">
    <div class="score" id="s1"><span class="dotc gold"></span><b>0</b></div>
    <div class="hud-title">هوكي الطاولة <span class="dim">· الفائز من يسجّل 7</span></div>
    <div class="score" id="s0"><b>0</b><span class="dotc cyan"></span></div>
  </div>
  <div id="stage"><canvas id="bg"></canvas><canvas id="fg"></canvas></div>
  <div id="banner"></div>
  <div id="lobby" class="lobby glass"></div>

  <script>
    // TV side of air hockey: owns the physics; each phone streams its finger position as a
    // target for its paddle. Table units: 1600 x 900, goals in the left and right walls.
    (function () {
      'use strict';
      var W = 1600, H = 900, GOAL = 300, PR = 50, KR = 30, WIN = 7;
      var MAX_PADDLE = 3000, MAX_PUCK = 3400, FRICTION = 0.22, BOUNCE = 0.9;
      var COLORS = ['#5fd0ff', '#f6cf6a']; // slot 0 = left (cyan), slot 1 = right (gold)

      var paddles, puck, score = [0, 0], phase = 'lobby', phaseEnd = 0, trail = [];

      var lobby = Lobby.create({
        game: 'hockey',
        title: 'هوكي الطاولة',
        hint: 'اسحب إصبعك على الجوال لتحريك المضرب',
        slots: [{ name: 'الأزرق · يسار', color: COLORS[0] }, { name: 'الذهبي · يمين', color: COLORS[1] }],
        onMove: function (slot, m) {
          var p = paddles[slot];
          p.tx = slot === 0 ? m.x * W / 2 : W / 2 + m.x * W / 2;
          p.ty = m.y * H;
        },
        onReady: function () { newMatch(); },
        onAgain: function () { if (phase === 'over') newMatch(); },
        onLeft: function () { phase = 'lobby'; },
      });

      function resetPaddles() {
        paddles = [
          { x: W * 0.12, y: H / 2, tx: W * 0.12, ty: H / 2, vx: 0, vy: 0 },
          { x: W * 0.88, y: H / 2, tx: W * 0.88, ty: H / 2, vx: 0, vy: 0 },
        ];
      }
      function serve(towardSlot) {
        puck = { x: W / 2 + (towardSlot === 0 ? -160 : 160), y: H / 2, vx: 0, vy: 0 };
        trail = [];
        phase = 'countdown'; phaseEnd = Date.now() + 2000;
      }
      function newMatch() {
        score = [0, 0]; showScore(); resetPaddles();
        serve(Math.random() < 0.5 ? 0 : 1);
        lobby.broadcast({ t: 'state', phase: 'play', score: score });
      }

      // ---- Physics (fixed 240 Hz steps so a fast puck can't tunnel through a paddle) ----
      function stepPaddle(p, slot, dt) {
        var minX = slot === 0 ? PR : W / 2 + PR, maxX = slot === 0 ? W / 2 - PR : W - PR;
        var tx = Math.max(minX, Math.min(maxX, p.tx)), ty = Math.max(PR, Math.min(H - PR, p.ty));
        var dx = tx - p.x, dy = ty - p.y, d = Math.sqrt(dx * dx + dy * dy), maxStep = MAX_PADDLE * dt;
        var k = d > maxStep ? maxStep / d : 1;
        p.vx = dx * k / dt; p.vy = dy * k / dt;
        p.x += dx * k; p.y += dy * k;
      }

      function collide(p, slot) {
        var dx = puck.x - p.x, dy = puck.y - p.y, d = Math.sqrt(dx * dx + dy * dy), min = PR + KR;
        if (d >= min || d === 0) return;
        var nx = dx / d, ny = dy / d;
        puck.x = p.x + nx * min; puck.y = p.y + ny * min;
        var rvx = puck.vx - p.vx, rvy = puck.vy - p.vy, vn = rvx * nx + rvy * ny;
        if (vn < 0) {
          puck.vx -= (1 + BOUNCE) * vn * nx; puck.vy -= (1 + BOUNCE) * vn * ny;
          var sp = Math.sqrt(puck.vx * puck.vx + puck.vy * puck.vy);
          if (sp > MAX_PUCK) { puck.vx *= MAX_PUCK / sp; puck.vy *= MAX_PUCK / sp; }
          sound(320 + Math.min(sp, 3000) / 10, 0.05);
          lobby.send(slot, { t: 'buzz', ms: 18 });
        }
      }

      function stepPuck(dt) {
        puck.x += puck.vx * dt; puck.y += puck.vy * dt;
        var f = Math.max(0, 1 - FRICTION * dt); puck.vx *= f; puck.vy *= f;
        if (puck.y < KR) { puck.y = KR; puck.vy = Math.abs(puck.vy) * BOUNCE; sound(220, 0.03); }
        if (puck.y > H - KR) { puck.y = H - KR; puck.vy = -Math.abs(puck.vy) * BOUNCE; sound(220, 0.03); }
        var inMouth = Math.abs(puck.y - H / 2) < GOAL / 2 - KR * 0.5;
        if (puck.x < KR && !inMouth) { puck.x = KR; puck.vx = Math.abs(puck.vx) * BOUNCE; sound(220, 0.03); }
        if (puck.x > W - KR && !inMouth) { puck.x = W - KR; puck.vx = -Math.abs(puck.vx) * BOUNCE; sound(220, 0.03); }
        if (puck.x < -KR) goal(1);
        else if (puck.x > W + KR) goal(0);
      }

      function goal(scorer) {
        score[scorer]++; showScore();
        sound(660, 0.25); setTimeout(function () { sound(880, 0.3); }, 160);
        lobby.send(scorer, { t: 'buzz', ms: 120 });
        lobby.send(1 - scorer, { t: 'buzz', ms: 400 });
        if (score[scorer] >= WIN) {
          phase = 'over';
          banner('فاز ' + (scorer === 0 ? 'الأزرق' : 'الذهبي') + ' ' + score[scorer] + ' – ' + score[1 - scorer] +
            '<small>اضغط «مباراة جديدة» على الجوال</small>', COLORS[scorer], 0);
          lobby.broadcast({ t: 'state', phase: 'over', winner: scorer, score: score });
          return;
        }
        banner('هدف!', COLORS[scorer], 1200);
        resetPaddles();
        serve(1 - scorer);
        lobby.broadcast({ t: 'state', phase: 'play', score: score });
      }

      // ---- Rendering ----
      var bg = document.getElementById('bg'), fg = document.getElementById('fg');
      var ctx = fg.getContext('2d'), scale = 1, sprites = {};

      function layout() {
        var stage = document.getElementById('stage').getBoundingClientRect();
        var res = 0.8; // render below CSS size: the TV's ARM CPU is modest
        scale = Math.min(stage.width / W, stage.height / H) * res;
        [bg, fg].forEach(function (c) {
          c.width = Math.round(W * scale); c.height = Math.round(H * scale);
          c.style.width = (c.width / res) + 'px'; c.style.height = (c.height / res) + 'px';
        });
        drawTable();
        sprites = { p0: disc(PR, COLORS[0], true), p1: disc(PR, COLORS[1], true), puck: disc(KR, '#ffffff', false) };
      }

      // Pre-rendered glowing discs: drawImage each frame is far cheaper than shadowBlur.
      function disc(r, color, paddle) {
        var pad = r * 0.8, s = Math.ceil((r + pad) * 2 * scale), c = document.createElement('canvas');
        c.width = c.height = s;
        var g = c.getContext('2d'), m = s / 2, rr = r * scale;
        g.shadowColor = color; g.shadowBlur = pad * scale;
        g.fillStyle = color; g.beginPath(); g.arc(m, m, rr, 0, Math.PI * 2); g.fill();
        g.shadowBlur = 0;
        var hl = g.createRadialGradient(m - rr * 0.35, m - rr * 0.35, rr * 0.1, m, m, rr);
        hl.addColorStop(0, 'rgba(255,255,255,0.75)'); hl.addColorStop(0.5, 'rgba(255,255,255,0.08)'); hl.addColorStop(1, 'rgba(0,0,0,0.25)');
        g.fillStyle = hl; g.beginPath(); g.arc(m, m, rr, 0, Math.PI * 2); g.fill();
        if (paddle) {
          g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = rr * 0.12;
          g.beginPath(); g.arc(m, m, rr * 0.5, 0, Math.PI * 2); g.stroke();
        }
        return c;
      }

      function drawTable() {
        var g = bg.getContext('2d'), s = scale;
        g.setTransform(s, 0, 0, s, 0, 0);
        g.clearRect(0, 0, W, H);
        // Glass surface over the graphite page.
        var surf = g.createLinearGradient(0, 0, 0, H);
        surf.addColorStop(0, 'rgba(255,255,255,0.13)'); surf.addColorStop(1, 'rgba(255,255,255,0.05)');
        roundRect(g, 0, 0, W, H, 60); g.fillStyle = surf; g.fill();
        g.lineWidth = 3; g.strokeStyle = 'rgba(255,255,255,0.35)'; g.stroke();
        // Centre line and circle.
        g.strokeStyle = 'rgba(246,207,106,0.55)'; g.lineWidth = 4;
        g.beginPath(); g.moveTo(W / 2, 20); g.lineTo(W / 2, H - 20); g.stroke();
        g.beginPath(); g.arc(W / 2, H / 2, 120, 0, Math.PI * 2); g.stroke();
        g.fillStyle = 'rgba(246,207,106,0.7)'; g.beginPath(); g.arc(W / 2, H / 2, 10, 0, Math.PI * 2); g.fill();
        // Goal creases and mouths in each player's colour.
        [[0, COLORS[0]], [1, COLORS[1]]].forEach(function (gc) {
          var x = gc[0] === 0 ? 0 : W;
          g.strokeStyle = gc[1]; g.globalAlpha = 0.45; g.lineWidth = 4;
          g.beginPath(); g.arc(x, H / 2, GOAL * 0.75, gc[0] === 0 ? -Math.PI / 2 : Math.PI / 2, gc[0] === 0 ? Math.PI / 2 : Math.PI * 1.5); g.stroke();
          g.globalAlpha = 1; g.lineWidth = 14; g.lineCap = 'round';
          g.beginPath(); g.moveTo(x, H / 2 - GOAL / 2); g.lineTo(x, H / 2 + GOAL / 2); g.stroke();
        });
      }

      function roundRect(g, x, y, w, h, r) {
        g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
        g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
      }

      function blit(img, x, y) { ctx.drawImage(img, x * scale - img.width / 2, y * scale - img.height / 2); }

      function render() {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, fg.width, fg.height);
        if (!paddles) return;
        if (puck) {
          for (var i = 0; i < trail.length; i++) {
            ctx.globalAlpha = (i + 1) / trail.length * 0.25;
            blit(sprites.puck, trail[i][0], trail[i][1]);
          }
          ctx.globalAlpha = 1;
          blit(sprites.puck, puck.x, puck.y);
        }
        blit(sprites.p0, paddles[0].x, paddles[0].y);
        blit(sprites.p1, paddles[1].x, paddles[1].y);
        if (phase === 'countdown') {
          var n = Math.ceil((phaseEnd - Date.now()) / 1000);
          ctx.setTransform(scale, 0, 0, scale, 0, 0);
          ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.font = '700 160px Tajawal, sans-serif'; ctx.textAlign = 'center';
          ctx.fillText(String(Math.max(1, n)), W / 2, H / 2 - 160);
        }
      }

      // ---- Loop ----
      var last = performance.now(), acc = 0, STEP = 1 / 240;
      function frame(now) {
        acc += Math.min(0.1, (now - last) / 1000); last = now;
        while (acc >= STEP) {
          if (paddles && phase !== 'lobby') {
            stepPaddle(paddles[0], 0, STEP); stepPaddle(paddles[1], 1, STEP);
            if (phase === 'play') { stepPuck(STEP); collide(paddles[0], 0); collide(paddles[1], 1); }
          }
          acc -= STEP;
        }
        if (phase === 'countdown' && Date.now() >= phaseEnd) phase = 'play';
        if (puck && phase === 'play') { trail.push([puck.x, puck.y]); if (trail.length > 6) trail.shift(); }
        render();
        requestAnimationFrame(frame);
      }

      // ---- HUD, banner, sound ----
      function showScore() {
        document.querySelector('#s0 b').textContent = score[0];
        document.querySelector('#s1 b').textContent = score[1];
      }
      var bannerTimer = null;
      function banner(html, color, ms) {
        var b = document.getElementById('banner');
        b.innerHTML = html; b.style.color = color; b.className = 'show';
        clearTimeout(bannerTimer);
        if (ms) bannerTimer = setTimeout(function () { b.className = ''; }, ms);
      }
      lobby.onHide = function () { document.getElementById('banner').className = ''; };

      var audio = null;
      function sound(freq, dur) {
        try {
          audio = audio || new (window.AudioContext || window.webkitAudioContext)();
          if (audio.state === 'suspended') audio.resume();
          var o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
          o.type = 'triangle'; o.frequency.value = freq;
          g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
          o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + dur);
        } catch (e) { /* no audio */ }
      }

      // Read-only snapshot for debugging from the browser console.
      window.hockeyState = function () { return JSON.parse(JSON.stringify({ phase: phase, score: score, puck: puck, paddles: paddles })); };

      resetPaddles();
      layout();
      window.addEventListener('resize', layout);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
