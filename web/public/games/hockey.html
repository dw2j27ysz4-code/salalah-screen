<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>هوكي الطاولة</title>
  <link rel="stylesheet" href="games.css">
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
  <script src="link.js"></script>
  <script src="lobby.js"></script>
  <script src="fx.js"></script>
</head>
<body class="tv">
  <div id="hud">
    <div class="score" id="s1"><span class="dotc gold"></span><b>0</b></div>
    <div class="hud-title">هوكي الطاولة <span class="dim">· الفائز من يسجّل 7</span></div>
    <div class="score" id="s0"><b>0</b><span class="dotc cyan"></span></div>
  </div>
  <div id="stage"></div>
  <div id="banner"></div>
  <div id="lobby" class="lobby glass"></div>

  <script>
    // TV side of air hockey: owns the physics; each phone streams its finger position as a
    // target for its paddle. Table units: 1600 x 900, goals in the left and right walls.
    // Rendering is PixiJS via fx.js (sparks, shockwaves, puck streak, goal bursts).
    (function () {
      'use strict';
      var W = 1600, H = 900, GOAL = 300, PR = 50, KR = 30, WIN = 7;
      var MAX_PADDLE = 3000, MAX_PUCK = 3400, FRICTION = 0.22, BOUNCE = 0.9;
      var COLORS = ['#5fd0ff', '#f6cf6a']; // slot 0 = left (cyan), slot 1 = right (gold)

      var paddles, puck, score = [0, 0], phase = 'lobby', phaseEnd = 0, hitStop = 0;

      var lobby = Lobby.create({
        game: 'hockey',
        title: 'هوكي الطاولة',
        hint: 'اسحب إصبعك على الجوال لتحريك المضرب',
        slots: [{ name: 'الأزرق · يسار', color: COLORS[0] }, { name: 'الذهبي · يمين', color: COLORS[1] }],
        onMove: function (slot, m) {
          var p = paddles[slot];
          p.tx = slot === 0 ? m.x * W / 2 : W / 2 + m.x * W / 2;
          p.ty = m.y * H;
        },
        onReady: function () { newMatch(); },
        onAgain: function () { if (phase === 'over') newMatch(); },
        onLeft: function () { phase = 'lobby'; },
      });

      function resetPaddles() {
        paddles = [
          { x: W * 0.12, y: H / 2, tx: W * 0.12, ty: H / 2, vx: 0, vy: 0 },
          { x: W * 0.88, y: H / 2, tx: W * 0.88, ty: H / 2, vx: 0, vy: 0 },
        ];
      }
      function serve(towardSlot) {
        puck = { x: W / 2 + (towardSlot === 0 ? -160 : 160), y: H / 2, vx: 0, vy: 0 };
        phase = 'countdown'; phaseEnd = Date.now() + 2000;
        fx.ring(puck.x, puck.y, 0xffffff, 140, 0.5);
      }
      function newMatch() {
        score = [0, 0]; showScore(); resetPaddles();
        serve(Math.random() < 0.5 ? 0 : 1);
        lobby.broadcast({ t: 'state', phase: 'play', score: score });
      }

      // ---- Physics (fixed 240 Hz steps so a fast puck can't tunnel through a paddle) ----
      function stepPaddle(p, slot, dt) {
        var minX = slot === 0 ? PR : W / 2 + PR, maxX = slot === 0 ? W / 2 - PR : W - PR;
        var tx = Math.max(minX, Math.min(maxX, p.tx)), ty = Math.max(PR, Math.min(H - PR, p.ty));
        var maxSpeed = lobby.isCpu(slot) ? MAX_PADDLE * CPU_SPEED : MAX_PADDLE;
        var dx = tx - p.x, dy = ty - p.y, d = Math.sqrt(dx * dx + dy * dy), maxStep = maxSpeed * dt;
        var k = d > maxStep ? maxStep / d : 1;
        p.vx = dx * k / dt; p.vy = dy * k / dt;
        p.x += dx * k; p.y += dy * k;
      }

      // Computer player: when the puck is in its half, get behind it (on its own goal side)
      // and drive through it toward the other goal; otherwise guard the goal, tracking the
      // puck's height. The target is eased so it reacts like a person, not instantly.
      var CPU_SPEED = 0.5, CPU_EASE = 0.12;
      function cpuThink(slot) {
        var p = paddles[slot], home = slot === 0 ? 0 : W, toward = slot === 0 ? 1 : -1, tx, ty;
        var inHalf = slot === 0 ? puck.x < W / 2 : puck.x > W / 2;
        if (phase === 'play' && inHalf && Math.abs(puck.x - home) > PR * 0.8) {
          var behind = (puck.x - p.x) * toward > 10;
          if (behind) { tx = puck.x + toward * 90; ty = puck.y + (H / 2 - puck.y) * 0.3; }
          else { tx = puck.x - toward * (PR + KR + 40); ty = puck.y + (p.y < puck.y ? -80 : 80); }
        } else {
          tx = home + toward * 170;
          ty = H / 2 + (puck.y - H / 2) * 0.6;
        }
        p.tx += (tx - p.tx) * CPU_EASE; p.ty += (ty - p.ty) * CPU_EASE;
      }

      function collide(p, slot) {
        var dx = puck.x - p.x, dy = puck.y - p.y, d = Math.sqrt(dx * dx + dy * dy), min = PR + KR;
        if (d >= min || d === 0) return;
        var nx = dx / d, ny = dy / d;
        puck.x = p.x + nx * min; puck.y = p.y + ny * min;
        var rvx = puck.vx - p.vx, rvy = puck.vy - p.vy, vn = rvx * nx + rvy * ny;
        if (vn < 0) {
          puck.vx -= (1 + BOUNCE) * vn * nx; puck.vy -= (1 + BOUNCE) * vn * ny;
          var sp = Math.sqrt(puck.vx * puck.vx + puck.vy * puck.vy);
          if (sp > MAX_PUCK) { puck.vx *= MAX_PUCK / sp; puck.vy *= MAX_PUCK / sp; sp = MAX_PUCK; }
          sound(320 + Math.min(sp, 3000) / 10, 0.05);
          lobby.send(slot, { t: 'buzz', ms: 18 });
          // Impact: sparks thrown along the new direction, a ring, and a beat of hit-stop on hard shots.
          var hx = p.x + nx * PR, hy = p.y + ny * PR, power = Math.min(1, sp / MAX_PUCK);
          fx.emit({ x: hx, y: hy, count: 8 + Math.round(power * 16), color: [COLORS[slot], 0xffffff], tex: 'spark',
            speed: [300, 900 + power * 900], life: [0.18, 0.45], size: 34, angle: Math.atan2(puck.vy, puck.vx), spread: 1.6, drag: 4 });
          fx.ring(hx, hy, COLORS[slot], 120 + power * 160, 0.35);
          if (power > 0.55) { fx.shake(6 + power * 8, 160); hitStop = 0.045; }
        }
      }

      function wallSpark(x, y, ang) {
        sound(220, 0.03);
        fx.emit({ x: x, y: y, count: 6, color: 0xffffff, tex: 'spark', speed: [200, 600], life: [0.15, 0.3], size: 22, angle: ang, spread: 1.8, drag: 5 });
      }

      function stepPuck(dt) {
        puck.x += puck.vx * dt; puck.y += puck.vy * dt;
        var f = Math.max(0, 1 - FRICTION * dt); puck.vx *= f; puck.vy *= f;
        if (puck.y < KR) { puck.y = KR; puck.vy = Math.abs(puck.vy) * BOUNCE; if (Math.abs(puck.vy) > 250) wallSpark(puck.x, 0, Math.PI / 2); }
        if (puck.y > H - KR) { puck.y = H - KR; puck.vy = -Math.abs(puck.vy) * BOUNCE; if (Math.abs(puck.vy) > 250) wallSpark(puck.x, H, -Math.PI / 2); }
        var inMouth = Math.abs(puck.y - H / 2) < GOAL / 2 - KR * 0.5;
        if (puck.x < KR && !inMouth) { puck.x = KR; puck.vx = Math.abs(puck.vx) * BOUNCE; if (Math.abs(puck.vx) > 250) wallSpark(0, puck.y, 0); }
        if (puck.x > W - KR && !inMouth) { puck.x = W - KR; puck.vx = -Math.abs(puck.vx) * BOUNCE; if (Math.abs(puck.vx) > 250) wallSpark(W, puck.y, Math.PI); }
        if (puck.x < -KR) goal(1);
        else if (puck.x > W + KR) goal(0);
      }

      function goal(scorer) {
        score[scorer]++; showScore();
        sound(660, 0.25); setTimeout(function () { sound(880, 0.3); }, 160);
        lobby.send(scorer, { t: 'buzz', ms: 120 });
        lobby.send(1 - scorer, { t: 'buzz', ms: 400 });
        // Goal: burst of confetti out of the net, big ring, screen shake and a flash.
        var gx = scorer === 0 ? W : 0, dir = scorer === 0 ? Math.PI : 0;
        fx.emit({ x: gx, y: H / 2, count: 70, color: [COLORS[scorer], 0xffffff, COLORS[scorer]], tex: 'square', add: false,
          speed: [300, 1100], life: [0.8, 1.6], size: 14, angle: dir, spread: 2.2, gravity: 700, drag: 1.2, spin: 14 });
        fx.emit({ x: gx, y: H / 2, count: 30, color: COLORS[scorer], speed: [100, 500], life: [0.4, 0.9], size: 60, angle: dir, spread: 2.4 });
        fx.ring(gx, H / 2, COLORS[scorer], 700, 0.6);
        fx.shake(22, 450); fx.flash(0.3);
        goalGlow[1 - scorer] = 1;
        if (score[scorer] >= WIN) {
          phase = 'over';
          banner('فاز ' + (scorer === 0 ? 'الأزرق' : 'الذهبي') + ' ' + score[scorer] + ' – ' + score[1 - scorer] +
            '<small>اضغط «مباراة جديدة» على الجوال</small>', COLORS[scorer], 0);
          lobby.broadcast({ t: 'state', phase: 'over', winner: scorer, score: score, solo: lobby.solo() });
          return;
        }
        banner('هدف!', COLORS[scorer], 1200);
        resetPaddles();
        serve(1 - scorer);
        lobby.broadcast({ t: 'state', phase: 'play', score: score });
      }

      // ---- Look ----
      var fx = GameFX.create(document.getElementById('stage'), W, H);
      var goalGlow = [0, 0];

      // Table: dark glass with soft reflections, glowing gold centre markings and player-coloured goal ends.
      fx.sprite(fx.texture(W, H, function (g) {
        var R = GameFX.roundRect;
        var base = g.createLinearGradient(0, 0, 0, H);
        base.addColorStop(0, '#3b3d44'); base.addColorStop(1, '#202126');
        R(g, 0, 0, W, H, 60); g.fillStyle = base; g.fill();
        g.save(); R(g, 0, 0, W, H, 60); g.clip();
        var side = [[0, COLORS[0]], [W, COLORS[1]]];
        side.forEach(function (s) {
          var gr = g.createRadialGradient(s[0], H / 2, 0, s[0], H / 2, W * 0.45);
          gr.addColorStop(0, s[1] + '33'); gr.addColorStop(1, s[1] + '00');
          g.fillStyle = gr; g.fillRect(0, 0, W, H);
        });
        // Diagonal reflections across the glass.
        [[0.18, 0.06], [0.5, 0.035], [0.72, 0.05]].forEach(function (r) {
          var x = W * r[0], gr = g.createLinearGradient(x, 0, x + 260, H);
          gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, 'rgba(255,255,255,' + r[1] + ')'); gr.addColorStop(1, 'rgba(255,255,255,0)');
          g.fillStyle = gr; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 180, 0); g.lineTo(x + 440, H); g.lineTo(x + 260, H); g.closePath(); g.fill();
        });
        GameFX.noise(g, W, H, 9000, 0.025);
        g.restore();
        // Markings with glow.
        g.shadowColor = '#f6cf6a'; g.shadowBlur = 18; g.strokeStyle = 'rgba(246,207,106,0.75)'; g.lineWidth = 5;
        g.beginPath(); g.moveTo(W / 2, 24); g.lineTo(W / 2, H - 24); g.stroke();
        g.beginPath(); g.arc(W / 2, H / 2, 130, 0, Math.PI * 2); g.stroke();
        g.fillStyle = '#f6cf6a'; g.beginPath(); g.arc(W / 2, H / 2, 12, 0, Math.PI * 2); g.fill();
        [[0, COLORS[0], -1], [W, COLORS[1], 1]].forEach(function (s) {
          g.shadowColor = s[1]; g.strokeStyle = s[1]; g.globalAlpha = 0.55; g.lineWidth = 5;
          g.beginPath(); g.arc(s[0], H / 2, GOAL * 0.78, s[2] < 0 ? -Math.PI / 2 : Math.PI / 2, s[2] < 0 ? Math.PI / 2 : Math.PI * 1.5); g.stroke();
          g.globalAlpha = 1;
        });
        g.shadowBlur = 0;
        // Raised rim with a bright top edge.
        R(g, 3, 3, W - 6, H - 6, 58); g.lineWidth = 6; g.strokeStyle = 'rgba(255,255,255,0.28)'; g.stroke();
        R(g, 12, 12, W - 24, H - 24, 50); g.lineWidth = 2; g.strokeStyle = 'rgba(0,0,0,0.35)'; g.stroke();
      }), 'bg').position.set(W / 2, H / 2);

      // Goal mouths: glowing bars that pulse when a goal goes in.
      var goalTex = fx.texture(60, GOAL + 120, function (g, w, h) {
        g.shadowColor = '#fff'; g.shadowBlur = 26; g.fillStyle = '#fff';
        GameFX.roundRect(g, w / 2 - 7, 60, 14, h - 120, 7); g.fill();
      });
      var goals = [0, 1].map(function (i) {
        var s = fx.sprite(goalTex, 'glow', { add: true, tint: COLORS[i] });
        s.position.set(i === 0 ? 4 : W - 4, H / 2);
        return s;
      });

      function discTex(r, color, paddle) {
        var pad = r * 0.9;
        return fx.texture((r + pad) * 2, (r + pad) * 2, function (g, w) {
          var m = w / 2;
          g.shadowColor = color; g.shadowBlur = pad * 1.1;
          var body = g.createRadialGradient(m - r * 0.3, m - r * 0.35, r * 0.1, m, m, r);
          body.addColorStop(0, '#ffffff'); body.addColorStop(0.25, color); body.addColorStop(1, shade(color, -0.45));
          g.fillStyle = body; g.beginPath(); g.arc(m, m, r, 0, Math.PI * 2); g.fill();
          g.shadowBlur = 0;
          if (paddle) {
            // Domed handle in the middle with a rim and specular highlight.
            g.strokeStyle = 'rgba(255,255,255,0.65)'; g.lineWidth = r * 0.08;
            g.beginPath(); g.arc(m, m, r * 0.92, 0, Math.PI * 2); g.stroke();
            var knob = g.createRadialGradient(m - r * 0.15, m - r * 0.2, r * 0.05, m, m, r * 0.45);
            knob.addColorStop(0, '#ffffff'); knob.addColorStop(0.5, shade(color, 0.2)); knob.addColorStop(1, shade(color, -0.35));
            g.fillStyle = knob; g.beginPath(); g.arc(m, m, r * 0.45, 0, Math.PI * 2); g.fill();
          }
          g.fillStyle = 'rgba(255,255,255,0.55)';
          g.beginPath(); g.ellipse(m - r * 0.35, m - r * 0.45, r * 0.32, r * 0.16, -0.6, 0, Math.PI * 2); g.fill();
        });
      }
      function shade(hex, k) {
        var n = parseInt(hex.slice(1), 16), r = n >> 16, gg = (n >> 8) & 255, b = n & 255;
        var f = function (c) { return Math.max(0, Math.min(255, Math.round(k < 0 ? c * (1 + k) : c + (255 - c) * k))); };
        return 'rgb(' + f(r) + ',' + f(gg) + ',' + f(b) + ')';
      }

      var shadows = [0, 1, 2].map(function (i) { var s = fx.sprite(fx.tex.shadow, 'shadow'); s.scale.set((i < 2 ? PR : KR) * 2.6 / 96); return s; });
      var paddleSprites = [0, 1].map(function (i) { return fx.sprite(discTex(PR, COLORS[i], true), 'obj'); });
      var streakTex = fx.texture(300, 60, function (g, w, h) {
        var gr = g.createLinearGradient(0, 0, w, 0);
        gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(255,255,255,0.8)');
        g.fillStyle = gr; g.beginPath(); g.moveTo(0, h / 2); g.lineTo(w - h / 2, 4); g.arc(w - h / 2, h / 2, h / 2 - 4, -Math.PI / 2, Math.PI / 2); g.closePath(); g.fill();
      });
      var streak = fx.sprite(streakTex, 'glow', { add: true });
      streak.anchor.set(1, 0.5);
      var puckSprite = fx.sprite(discTex(KR, '#ffffff', false), 'obj');
      var countText = fx.text('', W / 2, H / 2 - 190, 0xffffff, 170);

      // Chasing LED strip around the rim: dots whose brightness travels around the table.
      var leds = [], LED_N = 64;
      for (var li = 0; li < LED_N; li++) {
        var t = li / LED_N, per = 2 * (W + H), d = t * per, x, y;
        if (d < W) { x = d; y = 6; } else if (d < W + H) { x = W - 6; y = d - W; } else if (d < 2 * W + H) { x = W - (d - W - H); y = H - 6; } else { x = 6; y = H - (d - 2 * W - H); }
        var led = fx.sprite(fx.tex.dot, 'glow', { add: true, tint: x < W / 2 ? COLORS[0] : COLORS[1] });
        led.scale.set(26 / 64); led.position.set(x, y); led.t = t; leds.push(led);
      }
      fx.ambient(36, [0xffffff, COLORS[0], COLORS[1]]);
      var tags = [0, 1].map(function () { return fx.tag(''); });

      function render(dt) {
        var show = !!paddles;
        paddleSprites.forEach(function (s, i) { s.visible = show; if (show) s.position.set(paddles[i].x, paddles[i].y); });
        shadows.forEach(function (s, i) {
          var o = i < 2 ? (paddles && paddles[i]) : puck;
          s.visible = !!o; if (o) s.position.set(o.x + 10, o.y + 14);
        });
        puckSprite.visible = !!puck && phase !== 'lobby';
        streak.visible = false;
        if (puck) {
          puckSprite.position.set(puck.x, puck.y);
          var sp = Math.sqrt(puck.vx * puck.vx + puck.vy * puck.vy);
          if (sp > 500 && phase === 'play') {
            streak.visible = true; streak.position.set(puck.x, puck.y);
            streak.rotation = Math.atan2(puck.vy, puck.vx);
            streak.scale.set(Math.min(1.6, sp / 2000) / fx.px, 0.9 / fx.px);
            streak.alpha = Math.min(0.9, sp / 3000);
          }
        }
        var tnow = performance.now() / 1000;
        leds.forEach(function (l) { l.alpha = 0.15 + 0.85 * Math.pow(Math.max(0, Math.sin((l.t - tnow * 0.12) * Math.PI * 6)), 6); });
        // In a solo game, label who is who above the paddles.
        tags.forEach(function (tg, i) {
          tg.text = paddles && lobby.solo() && phase !== 'lobby' ? (lobby.isCpu(i) ? 'الكمبيوتر' : 'أنت') : '';
          if (paddles) tg.follow(paddles[i].x, paddles[i].y - PR - 26);
        });
        goals.forEach(function (s, i) {
          goalGlow[i] = Math.max(0, goalGlow[i] - dt * 0.8);
          s.alpha = 0.55 + 0.25 * Math.sin(performance.now() / 400 + i) + goalGlow[i] * 0.8;
        });
        if (phase === 'countdown') {
          var left = (phaseEnd - Date.now()) / 1000, n = Math.max(1, Math.ceil(left)), f = left - Math.floor(left);
          countText.text = String(n); countText.alpha = 0.3 + 0.7 * f;
          countText.scale.set((0.8 + 0.5 * f) / fx.px);
        } else countText.text = '';
      }

      // ---- Loop ----
      var acc = 0, STEP = 1 / 240;
      fx.app.ticker.add(function () {
        var dt = Math.min(0.1, fx.app.ticker.deltaMS / 1000);
        if (paddles && puck) [0, 1].forEach(function (s) { if (lobby.isCpu(s)) cpuThink(s); });
        if (hitStop > 0) { hitStop -= dt; } else {
          acc += dt;
          while (acc >= STEP) {
            if (paddles && phase !== 'lobby') {
              stepPaddle(paddles[0], 0, STEP); stepPaddle(paddles[1], 1, STEP);
              if (phase === 'play') { stepPuck(STEP); collide(paddles[0], 0); collide(paddles[1], 1); }
            }
            acc -= STEP;
          }
        }
        if (phase === 'countdown' && Date.now() >= phaseEnd) phase = 'play';
        fx.update(dt);
        render(dt);
      });

      // ---- HUD, banner, sound ----
      function showScore() {
        document.querySelector('#s0 b').textContent = score[0];
        document.querySelector('#s1 b').textContent = score[1];
      }
      var bannerTimer = null;
      function banner(html, color, ms) {
        var b = document.getElementById('banner');
        b.innerHTML = html; b.style.color = color; b.className = 'show';
        clearTimeout(bannerTimer);
        if (ms) bannerTimer = setTimeout(function () { b.className = ''; }, ms);
      }
      lobby.onHide = function () { document.getElementById('banner').className = ''; };

      var audio = null;
      function sound(freq, dur) {
        try {
          audio = audio || new (window.AudioContext || window.webkitAudioContext)();
          if (audio.state === 'suspended') audio.resume();
          var o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
          o.type = 'triangle'; o.frequency.value = freq;
          g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
          o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + dur);
        } catch (e) { /* no audio */ }
      }

      // Read-only snapshot for debugging from the browser console.
      window.hockeyState = function () { return JSON.parse(JSON.stringify({ phase: phase, score: score, puck: puck, paddles: paddles })); };

      resetPaddles();
    })();
  </script>
</body>
</html>
