name: Deploy info screen

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *' # refresh news.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node web/scripts/fetch-news.mjs
      # Stamp assets with the commit so TVs never run a cached copy; the page
      # polls version.json and reloads itself when a new commit is deployed.
      - run: |
          V="${GITHUB_SHA::7}"
          sed -i "s/__V__/$V/g" web/public/index.html
          echo "{\"v\":\"$V\"}" > web/public/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/public
      - id: deployment
        uses: actions/deploy-pages@v4
